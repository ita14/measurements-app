version: "3.9"

services:
  api:
    container_name: measurements-api
    hostname: measurements-api.local
    build: ./src/measurements-api/
    depends_on:
      - db
      - keycloak
    ports:
      - "7001:80"
    networks:
     measurements-app:
        ipv4_address: 172.24.0.2

  app:
    container_name: measurements-app
    hostname: measurements-app.local
    build: ./src/measurements-app/
    depends_on:
      - api
    ports:
      - "8001:80"
    networks:
      measurements-app:
        ipv4_address: 172.24.0.3

  collector:
    container_name: measurements-collector
    hostname: measurements-collector.local
    build: ./src/measurements-collector/
    depends_on:
      - db
      - keycloak
      - api
    networks:
      measurements-app:
        ipv4_address: 172.24.0.4

  db:
    container_name: postgres-timescale
    hostname: postgres.local
    image: "timescale/timescaledb:latest-pg16"
    restart: always
    environment:
      - POSTGRES_DB=MeasurementsDB
      - POSTGRES_USER=measurements_user
      - POSTGRES_PASSWORD=measurements_pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      measurements-app:
        ipv4_address: 172.24.0.99
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/measurements-api/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    container_name: keycloak
    hostname: keycloak.local
    image: quay.io/keycloak/keycloak:20.0.1
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    networks:
      measurements-app:
        ipv4_address: 172.24.0.98
    volumes:
      - keycloak:/opt/keycloak/data
      - ./src/assets/keycloak/realm:/tmp/realm
      - ./src/assets/keycloak/realm:/opt/keycloak/data/import
    command: |
      start-dev --import-realm
    # Use below for exporting realm config. Authorization block may have to be
    # manually removed from the configuration.
    # command: |
    #   export \
    #     --file /tmp/realm/measurements-app.json \
    #     --realm measurements-app \
    #     --users realm_file

networks:
  measurements-app:
    ipam:
        driver: default
        config:
          - subnet: "172.24.0.0/16"

volumes:
  postgres_data:
  keycloak:
